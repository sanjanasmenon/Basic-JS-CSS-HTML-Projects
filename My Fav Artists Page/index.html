<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>My Fav Artists!</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Limelight&display=swap');
    </style>
</head>
<body>
    <h1 class="title">
        My Fav Artists!
    </h1>
    <span id="subtitle">
        (Some of them, at least)
    </span>
    <main>
        <div class="artist-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2mpnEBam3dC0D8wNKLCjE8jJJkj5zEF57xHKp4A57yQ&s" 
                id="artist-photo" alt="Picture of Artist">
            <span id="artist-name">
                Name
            </span>
            <span id="artist-lyric">
                A Fav Lyric
            </span> 
            <span id="artist-genre">
                Genres
            </span>
            <span id="artist-album">
                My Fav Album
            </span> 
            <span id="artist-desc">
                Description
            </span>
            <div class="buttons">
                <button class="back"><img src="./2.png"></button>
                <button class="forward"><img src="./1.png"></button>
            </div>
        </div>
    </main>
    <span id="photo-disclaimer">
        Photo credits go to their rightful owners!
    </span>

    <script src="js/script.js"></script>
</body>
</html>
